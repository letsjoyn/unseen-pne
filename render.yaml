services:
  - type: web
    name: unseen-pne-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: API_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
